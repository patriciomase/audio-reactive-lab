<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <meta name="description" content="Turn music and microphone input into immersive, real-time visual art in your browser." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fatbeats.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FATBEATS.org" />
    <meta property="og:title" content="FATBEATS.org — Make sound visible" />
    <meta property="og:description" content="Turn music and microphone input into immersive, real-time visual art in your browser." />
    <meta property="og:url" content="https://fatbeats.org/" />
    <meta property="og:image" content="https://fatbeats.org/social-preview.png" />
    <meta property="og:image:secure_url" content="https://fatbeats.org/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FATBEATS.org — Make sound visible" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FATBEATS.org — Make sound visible" />
    <meta name="twitter:description" content="Turn music and microphone input into immersive, real-time visual art in your browser." />
    <meta name="twitter:image" content="https://fatbeats.org/social-preview.png" />
    <meta name="twitter:image:alt" content="FATBEATS.org — Make sound visible" />
    <title>FATBEATS.org — Make sound visible</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FATBEATS.org",
        "url": "https://fatbeats.org/",
        "description": "Turn music and microphone input into immersive, real-time visual art in your browser.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any modern web browser",
        "isAccessibleForFree": true,
        "author": {
          "@type": "Person",
          "name": "Pato",
          "url": "https://patriciomase.com/"
        }
      }
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="f9d6fdc3-7b40-43e4-903c-373a11180542" data-domains="fatbeats.org,www.fatbeats.org"></script>
  </head>
  <body>
    <main>
      <canvas aria-hidden="true"></canvas>
      <header>
        <div class="mark"><span></span>FATBEATS.org</div>
        <div class="status"><i></i><span>DEMO SIGNAL</span></div>
      </header>
      <section class="intro">
        <h1>Make sound<br />visible.</h1>
        <button class="listen">Enable microphone <span>↗</span></button>
        <div class="error" hidden></div>
      </section>
      <button class="settings-toggle" type="button" aria-controls="settings-panel" aria-expanded="false">Settings</button>
      <aside class="meter" id="settings-panel" aria-label="Settings">
        <div class="setting">
          <label for="sensitivity">SENSITIVITY <b>1.4</b></label>
          <input id="sensitivity" type="range" min="0.5" max="2.5" step="0.1" value="1.4" />
        </div>
        <div class="setting">
          <label for="color-mode">COLOR</label>
          <select id="color-mode">
            <option value="original">Original</option>
            <option value="dark">Dark</option>
            <option value="colorful">Colorful</option>
            <option value="random">Random</option>
            <option value="vibrant">Vibrant</option>
          </select>
        </div>
        <div class="setting equalizer-setting">
          <label for="equalizer-text">CENTER TEXT</label>
          <input id="equalizer-text" type="text" maxlength="24" value="FATBEATS.ORG" spellcheck="false" />
        </div>
        <div class="setting equalizer-setting">
          <label for="equalizer-font-size">FONT SIZE <b><span class="equalizer-font-size-value">75</span>%</b></label>
          <input id="equalizer-font-size" type="range" min="50" max="125" step="5" value="75" />
        </div>
        <div class="setting toggle-setting">
          <label for="auto-transition">AUTO TRANSITION</label>
          <input id="auto-transition" type="checkbox" />
        </div>
        <div class="setting toggle-setting">
          <label for="debug-mode">DEBUG MODE</label>
          <input id="debug-mode" type="checkbox" />
        </div>
        <div class="setting">
          <label for="transition-time">TRANSITION TIME <b><span class="transition-value">30</span>S</b></label>
          <input id="transition-time" type="range" min="10" max="180" step="5" value="30" />
        </div>
        <div class="app-version" aria-label="Application version">VERSION <b></b></div>
        <a class="creator-link" href="https://patriciomase.com" target="_blank" rel="noopener noreferrer">Made by Pato <span aria-hidden="true">↗</span></a>
      </aside>
      <nav aria-label="Visual modes">
        <select id="visualization-mode" aria-label="Visualization"></select>
      </nav>
      <aside class="debug-panel" aria-label="Performance debug information" hidden>
        <div><span>VIS</span><b data-debug="mode">—</b></div>
        <div><span>RENDER</span><b data-debug="fps">—</b></div>
        <div><span>DRAW AVG</span><b data-debug="draw-average">—</b></div>
        <div><span>DRAW MAX</span><b data-debug="draw-maximum">—</b></div>
        <div><span>JS BUDGET</span><b data-debug="load">—</b></div>
        <div><span>AUDIO</span><b data-debug="audio-context">DEMO</b></div>
        <div><span>MIC TRACK</span><b data-debug="mic-track">—</b></div>
        <div><span>RAW SIGNAL</span><b data-debug="signal">—</b></div>
        <div><span>CANVAS</span><b data-debug="canvas">—</b></div>
        <div><span>SURFACE</span><b data-debug="surface">—</b></div>
        <div><span>JS HEAP</span><b data-debug="heap">—</b></div>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
