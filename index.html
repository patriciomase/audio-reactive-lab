<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <title>Audio Reactive Lab</title>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="f9d6fdc3-7b40-43e4-903c-373a11180542" data-domains="patriciomase.github.io"></script>
  </head>
  <body>
    <main>
      <canvas aria-hidden="true"></canvas>
      <header>
        <div class="mark"><span></span>AUDIO REACTIVE LAB</div>
        <div class="status"><i></i><span>DEMO SIGNAL</span></div>
      </header>
      <section class="intro">
        <p>REAL-TIME AUDIO STUDY / 001</p>
        <h1>Make sound<br />visible.</h1>
        <button class="listen">Enable microphone <span>↗</span></button>
        <div class="error" hidden></div>
      </section>
      <aside class="meter" aria-label="Sensitivity control">
        <div class="setting">
          <label for="sensitivity">SENSITIVITY <b>1.4</b></label>
          <input id="sensitivity" type="range" min="0.5" max="2.5" step="0.1" value="1.4" />
        </div>
        <div class="setting">
          <label for="color-mode">COLOR</label>
          <select id="color-mode">
            <option value="original">Original</option>
            <option value="dark">Dark</option>
            <option value="colorful">Colorful</option>
            <option value="random">Random</option>
            <option value="vibrant">Vibrant</option>
          </select>
        </div>
        <div class="setting equalizer-setting">
          <label for="equalizer-text">CENTER TEXT</label>
          <input id="equalizer-text" type="text" maxlength="24" value="LIVE" spellcheck="false" />
        </div>
        <div class="setting toggle-setting">
          <label for="auto-transition">AUTO TRANSITION <b class="auto-state">OFF</b></label>
          <input id="auto-transition" type="checkbox" />
        </div>
        <div class="setting">
          <label for="transition-time">TRANSITION TIME <b><span class="transition-value">30</span>S</b></label>
          <input id="transition-time" type="range" min="10" max="180" step="5" value="30" />
        </div>
      </aside>
      <nav aria-label="Visual modes">
        <select id="visualization-mode" aria-label="Visualization">
          <option value="orbit">01 — Orbit</option>
          <option value="terrain">02 — Terrain</option>
          <option value="prism">03 — Prism</option>
          <option value="overlap">04 — Overlap</option>
          <option value="universe">05 — Universe</option>
          <option value="tangle">06 — Tangle</option>
          <option value="tunnel">07 — Tunnel</option>
          <option value="trace">08 — Trace</option>
          <option value="equalizer">09 — Equalizer</option>
          <option value="glyph">10 — Glyph</option>
        </select>
        <div hidden>
          <button data-mode="orbit" class="active">Orbit</button>
          <button data-mode="terrain">Terrain</button>
          <button data-mode="prism">Prism</button>
          <button data-mode="overlap">Overlap</button>
          <button data-mode="universe">Universe</button>
          <button data-mode="tangle">Tangle</button>
          <button data-mode="tunnel">Tunnel</button>
          <button data-mode="trace">Trace</button>
          <button data-mode="equalizer">Equalizer</button>
          <button data-mode="glyph">Glyph</button>
        </div>
      </nav>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
