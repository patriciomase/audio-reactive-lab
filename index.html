<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <title>Audio Reactive Lab</title>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="f9d6fdc3-7b40-43e4-903c-373a11180542" data-domains="patriciomase.github.io"></script>
  </head>
  <body>
    <main>
      <canvas aria-hidden="true"></canvas>
      <header>
        <div class="mark"><span></span>AUDIO REACTIVE LAB</div>
        <div class="status"><i></i><span>DEMO SIGNAL</span></div>
      </header>
      <section class="intro">
        <p>REAL-TIME AUDIO STUDY / 001</p>
        <h1>Make sound<br />visible.</h1>
        <button class="listen">Enable microphone <span>↗</span></button>
        <div class="error" hidden></div>
      </section>
      <aside class="meter" aria-label="Sensitivity control">
        <div class="setting">
          <label for="sensitivity">SENSITIVITY <b>1.4</b></label>
          <input id="sensitivity" type="range" min="0.5" max="2.5" step="0.1" value="1.4" />
        </div>
        <div class="setting">
          <label for="color-mode">COLOR</label>
          <select id="color-mode">
            <option value="original">Original</option>
            <option value="dark">Dark</option>
            <option value="colorful">Colorful</option>
            <option value="random">Random</option>
            <option value="vibrant">Vibrant</option>
          </select>
        </div>
      </aside>
      <nav aria-label="Visual modes">
        <button data-mode="orbit" class="active"><span>01</span>Orbit</button>
        <button data-mode="terrain"><span>02</span>Terrain</button>
        <button data-mode="prism"><span>03</span>Prism</button>
        <button data-mode="overlap"><span>04</span>Overlap</button>
        <button data-mode="universe"><span>05</span>Universe</button>
        <button data-mode="tangle"><span>06</span>Tangle</button>
        <button data-mode="tunnel"><span>07</span>Tunnel</button>
        <button data-mode="trace"><span>08</span>Trace</button>
      </nav>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
